# kitty-workbench popup profile
#
# This is loaded only by the quick-access panel. The normal Kitty theme is
# still inherited, while the geometry and control socket remain isolated from
# the user's main Kitty instance.

edge center-sized
columns 105
lines 28
background_opacity 1.0
hide_on_focus_loss yes
start_as_hidden no
focus_policy on-demand

kitty_override allow_remote_control=socket-only
# Kitty appends its process ID to this prefix, preventing stale-socket reuse.
kitty_override listen_on=unix:/tmp/kitty-workbench-panel
