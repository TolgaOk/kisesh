# kitty-workbench integration (experimental)
#
# This file has no effect until explicitly included from kitty.conf. Removing
# that include disables the watcher and all mappings without touching saved
# session data.

watcher ~/.local/lib/kitty-workbench/kitty_workbench/watcher.py

# The persistent identity row is Kitty's own tab bar. It stays visible for a
# one-tab session and follows the user's existing tab_bar_edge and colors.
tab_bar_style custom
tab_bar_min_tabs 1

# Command-W remains an in-process Kitty action for ordinary tabs. The no-UI
# kitten asks before the final tracked tab and delegates only its durable save.
map cmd+w kitten ~/.local/lib/kitty-workbench/integration/safe_close.py

# The session manager is global. Kitty renders its transient UI as an overlay,
# while this marker keeps the rendering surface out of ownership and snapshots.
# Only the invocation tab is used as source context for membership actions.
map alt+s launch --type=overlay --copy-env --cwd=current --var=kitty_workbench_ui=yes --title=Workbench ~/.local/lib/kitty-workbench/bin/kitty-workbench manager

# Kitty uses the last applicable mapping. When the overlay itself has focus,
# these conditional mappings therefore turn the same shortcuts into close
# actions instead of stacking another Workbench overlay.
map --when-focus-on var:kitty_workbench_ui alt+s close_window
map --when-focus-on var:kitty_workbench_ui cmd+w close_window

# Explicit save remains available even with autosave enabled.
map alt+shift+s launch --type=background --cwd=current ~/.local/lib/kitty-workbench/bin/kitty-workbench save
