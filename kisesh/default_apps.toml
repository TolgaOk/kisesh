version = 2

# Unknown foreground apps are typed at the restored prompt but never submitted.
# Agents and regular apps share presentation fields but have distinct restore rules.
[defaults]
restore = "prefill"
label = "App"
icon = ""

[agents.aider]
match = ["aider", "aider-*"]
restore = "captured"
label = "Aider"
icon = "󰚩"

[agents.claude]
match = ["claude", "claude-*"]
restore = "resume"
adapter = "claude"
label = "Claude"
icon = "✻"

[agents.codex]
match = ["codex", "codex-*"]
restore = "resume"
adapter = "codex"
label = "Codex"
icon = "󰋙"

[agents.gemini]
match = ["gemini", "gemini-*"]
restore = "captured"
label = "Gemini"
icon = "✦"

[agents.opencode]
match = ["opencode", "opencode-*"]
restore = "captured"
label = "OpenCode"
icon = "󰅩"

[agents.pi]
match = ["pi"]
restore = "resume"
adapter = "pi"
label = "Pi"
icon = "π"

[apps.btop]
match = ["btop"]
restore = "captured"
label = "btop"
icon = "󰍛"

[apps.helix]
match = ["helix", "hx"]
restore = "captured"
label = "Helix"
icon = "󰘧"

[apps.htop]
match = ["htop"]
restore = "captured"
label = "htop"
icon = "󰍛"

[apps.lazygit]
match = ["lazygit"]
restore = "captured"
label = "lazygit"
icon = ""

[apps.nvim]
match = ["nvim", "nvim-*"]
restore = "captured"
label = "Neovim"
icon = ""

[apps.vim]
match = ["vim", "vi"]
restore = "captured"
label = "Vim"
icon = ""

[apps.top]
match = ["top"]
restore = "configured"
argv = ["top"]
label = "top"
icon = "󰍛"

[apps.yazi]
match = ["yazi"]
restore = "captured"
label = "Yazi"
icon = "󰉋"
